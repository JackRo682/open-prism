name: Android preview APK

on:
  push:
    branches: ['mobile/**']
    paths: ['mobile/**', '.github/workflows/android-preview.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --include=dev --no-fund --no-audit
      - run: npm run verify
      - name: Generate the native Android project
        run: npx --no-install expo prebuild --platform android --no-install
      - name: Build a standalone APK for phones and emulators
        working-directory: mobile/android
        run: >
          bash ./gradlew :app:assembleRelease --no-daemon --max-workers=2
          -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Check the APK signature and record its checksum
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose "$apk"
          mkdir -p preview
          cp "$apk" preview/GetOpenPrism-preview.apk
          cd preview
          sha256sum GetOpenPrism-preview.apk > SHA256SUMS
      - name: Save the development preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GetOpenPrism-Android-preview
          path: mobile/preview/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
