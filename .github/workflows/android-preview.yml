name: Android preview APK

on:
  push:
    branches: ['mobile/**']
    paths: ['mobile/**', 'scripts/android-preview-smoke.py', '.github/workflows/android-preview.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --include=dev --no-fund --no-audit
      - run: npm run verify
      - name: Generate the native Android project
        run: npx --no-install expo prebuild --platform android --no-install
      - name: Build a standalone APK for phones and emulators
        working-directory: mobile/android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash ./gradlew :app:assembleRelease --info --no-daemon --max-workers=2 \
            -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Check the APK signature and record its checksum
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose "$apk"
          mkdir -p preview
          cp "$apk" preview/GetOpenPrism-preview.apk
          cd preview
          sha256sum GetOpenPrism-preview.apk > SHA256SUMS
      - name: Save the development preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GetOpenPrism-Android-preview
          path: mobile/preview/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_TEST_APK: ${{ github.workspace }}/preview/GetOpenPrism-preview.apk
      ANDROID_TEST_OUTPUT: ${{ github.workspace }}/android-test-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GetOpenPrism-Android-preview
          path: preview
      - name: Verify the APK downloaded from the build
        working-directory: preview
        run: sha256sum -c SHA256SUMS
      - name: Allow the runner to use hardware virtualization
        run: sudo chmod a+rw /dev/kvm
      - name: Install the app and test Android navigation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 scripts/android-preview-smoke.py
      - name: Retain screenshots and runtime logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GetOpenPrism-Android-device-test
          path: android-test-results/
          retention-days: 7
