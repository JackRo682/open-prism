name: Mobile checks
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
      - '.devcontainer/mobile/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: mobile/.nvmrc
      - run: npm install --no-fund --no-audit
      - name: Export the generated npm lock for the setup commit
        run: |
          node -e "const fs=require('node:fs'); const z=require('node:zlib'); const out=z.gzipSync(fs.readFileSync('package-lock.json')).toString('base64'); for(let i=0;i<out.length;i+=900) console.log('LOCKPART '+out.slice(i,i+900));"
      - run: npm run typecheck
      - run: npm run check:expo
      - run: npm run export
      - name: Save dependency lock for the initial setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-dependency-lock
          path: mobile/package-lock.json
          if-no-files-found: error
