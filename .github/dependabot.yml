version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      framework:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - react-server-dom-webpack
          - vinext
          - vite
          - '@vitejs/*'
          - '@cloudflare/*'
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
